<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Support</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#fefce8', 100: '#fef9c3', 500: '#eab308', 600: '#ca8a04', 700: '#a16207' }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase App (Compat) & Realtime Database & Auth SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
</head>
<body class="h-full bg-slate-100 dark:bg-slate-950 font-sans text-slate-800 dark:text-slate-100 antialiased overflow-hidden flex flex-col">

    <!-- Top Navigation Bar -->
    <header class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 h-16 flex items-center justify-between px-4 sm:px-6 flex-shrink-0 z-20">
        <div class="flex items-center space-x-3">
            <button id="openSidebar" class="hidden md:hidden text-slate-600 dark:text-slate-300 hover:text-yellow-600 focus:outline-none">
                <i class="fa-solid fa-bars text-xl"></i>
            </button>
            <div class="flex items-center space-x-2">
                <div class="w-10 h-10 rounded-full overflow-hidden bg-slate-900 flex items-center justify-center ring-2 ring-yellow-500 shadow-sm cursor-pointer relative group" onclick="document.getElementById('adminLogoInput').click()">
                    <div id="adminLogoContainer" class="w-full h-full flex items-center justify-center text-white font-bold">
                        <img src="logo.png" alt="Logo" class="w-full h-full object-cover">
                    </div>
                    <div class="absolute inset-0 bg-black/40 hidden group-hover:flex items-center justify-center text-white text-[10px]">Edit</div>
                </div>
                <input type="file" id="adminLogoInput" class="hidden" accept="image/*" onchange="handleAdminLogoSelected(event)">
                <div>
                    <h1 class="font-bold text-base sm:text-lg tracking-wide text-slate-900 dark:text-white leading-tight">Support Center</h1>
                    <span class="text-[10px] text-yellow-600 dark:text-yellow-400 font-semibold uppercase tracking-wider">Chat Portal</span>
                </div>
            </div>
        </div>

        <div class="flex items-center space-x-3">
            <!-- Theme Toggle -->
            <button id="themeToggleTop" class="w-9 h-9 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 flex items-center justify-center hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">
                <i class="fa-solid fa-moon dark:hidden"></i>
                <i class="fa-solid fa-sun hidden dark:inline text-yellow-400"></i>
            </button>

            <!-- Google Login Button (For Customers) -->
            <button id="googleLoginBtn" onclick="loginWithGoogle()" class="flex items-center space-x-2 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700/70 text-slate-700 dark:text-slate-200 px-4 py-2 rounded-full text-xs font-semibold shadow-sm transition-all">
                <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-4 h-4" alt="Google">
                <span>Login with Google</span>
            </button>

            <!-- Logged In Profile View -->
            <div id="customerProfileView" class="hidden items-center space-x-2">
                <img id="loggedInCustomerPhoto" src="" class="w-8 h-8 rounded-full object-cover ring-1 ring-yellow-500" alt="Profile">
                <div class="hidden sm:block text-left">
                    <p id="loggedInCustomerName" class="text-xs font-bold leading-none text-slate-900 dark:text-white truncate max-w-[100px]"></p>
                    <p id="loggedInCustomerEmail" class="text-[9px] text-slate-400 truncate max-w-[120px]"></p>
                </div>
                <button onclick="logoutGoogle()" title="Logout" class="text-slate-400 hover:text-red-500 text-xs p-1 ml-1">
                    <i class="fa-solid fa-power-off"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Layout -->
    <div class="flex-1 flex overflow-hidden relative">

        <!-- Sidebar (Visible to Admin or responsive toggle) -->
        <aside id="sidebar" class="absolute md:relative inset-y-0 left-0 w-80 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 flex flex-col z-10 transform -translate-x-full md:translate-x-0 transition-transform duration-200 ease-in-out shadow-lg md:shadow-none">
            <div class="p-3 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
                <h2 class="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">Customer Chats</h2>
                <button id="closeSidebar" class="md:hidden text-slate-400 hover:text-slate-600 text-sm">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <!-- Search Filter -->
            <div class="p-2 border-b border-slate-100 dark:border-slate-800/60">
                <div class="relative">
                    <i class="fa-solid fa-search absolute left-3 top-2.5 text-slate-400 text-xs"></i>
                    <input type="text" id="searchCustomer" placeholder="Search customer..." class="w-full pl-8 pr-3 py-1.5 bg-slate-100 dark:bg-slate-800 border-none rounded-lg text-xs text-slate-800 dark:text-slate-200 focus:ring-1 focus:ring-yellow-500">
                </div>
            </div>
            <!-- Customer List Container -->
            <div id="chatList" class="flex-1 overflow-y-auto divide-y divide-slate-100 dark:divide-slate-800/50">
                <!-- Dynamic customer items will be loaded here -->
            </div>
        </aside>

        <!-- Chat Window Area -->
        <main class="flex-1 flex flex-col bg-slate-50 dark:bg-slate-950 overflow-hidden relative">
            
            <!-- Message History Container -->
            <div id="messageContainer" class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-4">
                <div class="flex justify-center">
                    <span class="px-3 py-1 bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-400 text-xs rounded-full shadow-sm font-medium">Secure Chat Session</span>
                </div>
            </div>

            <!-- Voice Recording Preview Panel -->
            <div id="recordingUI" class="hidden absolute bottom-20 left-4 right-4 bg-white dark:bg-slate-900 p-3 rounded-2xl shadow-xl border border-red-500/30 items-center justify-between z-20 animate-bounce-short">
                <div class="flex items-center space-x-3">
                    <div class="w-3 h-3 rounded-full bg-red-500 animate-ping"></div>
                    <span class="text-xs font-semibold text-slate-700 dark:text-slate-200">Recording Audio... <span id="recordingTimer" class="text-red-500 font-mono font-bold ml-1">00:00</span></span>
                </div>
                <div class="flex items-center space-x-2">
                    <button onclick="cancelRecording()" class="px-3 py-1.5 text-xs text-slate-500 hover:text-red-500 font-medium">Cancel</button>
                    <button onclick="stopAndSendRecording()" class="px-4 py-1.5 bg-red-500 hover:bg-red-600 text-white rounded-xl text-xs font-bold shadow-md">Send Voice</button>
                </div>
            </div>

            <!-- Message Input Form -->
            <form id="messageForm" onsubmit="handleSendMessage(event)" class="bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 p-3 sm:p-4 flex items-center space-x-2 flex-shrink-0">
                <!-- File Attachment Input (Gallery) -->
                <input type="file" id="galleryInput" class="hidden" accept="image/*" onchange="handleGalleryPhotoSelected(event)">
                <button type="button" onclick="document.getElementById('galleryInput').click()" title="Attach Photo" class="w-10 h-10 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-700 flex items-center justify-center flex-shrink-0 transition-colors">
                    <i class="fa-solid fa-image"></i>
                </button>

                <!-- Voice Recording Mic Button -->
                <button type="button" id="micBtn" onclick="toggleRecording()" title="Hold or Click to Record Voice" class="w-10 h-10 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-700 flex items-center justify-center flex-shrink-0 transition-colors" disabled>
                    <i class="fa-solid fa-microphone"></i>
                </button>

                <!-- Text Input Box -->
                <input type="text" id="messageInput" placeholder="Please login with Google to type..." disabled class="flex-1 bg-slate-100 dark:bg-slate-800 text-slate-800 dark:text-slate-100 placeholder-slate-400 text-xs sm:text-sm rounded-xl px-4 py-2.5 focus:outline-none focus:ring-1 focus:ring-yellow-500 opacity-60">

                <!-- Send Button -->
                <button type="submit" id="sendBtn" disabled class="w-10 h-10 rounded-xl bg-yellow-600/50 cursor-not-allowed text-white flex items-center justify-center flex-shrink-0 shadow-sm transition-all">
                    <i class="fa-solid fa-paper-plane text-xs"></i>
                </button>
            </form>
        </main>
    </div>

    <!-- Application Script Block -->
    <script>
        // Firebase Configuration
        const firebaseConfig = {
          apiKey: "AIzaSyBn0kORKJHN_X4uVidhjulK-dAnRujOO3A",
          authDomain: "gaule-top-up-center.firebaseapp.com",
          databaseURL: "https://gaule-top-up-center-default-rtdb.firebaseio.com",
          projectId: "gaule-top-up-center",
          storageBucket: "gaule-top-up-center.firebasestorage.app",
          messagingSenderId: "645605489690",
          appId: "1:645605489690:web:0b0f2898d295be03c1e5a3",
          measurementId: "G-M7BY3PQM3H"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        
        // Realtime Database & Auth initialization
        const rtdb = firebase.database();
        const auth = firebase.auth();

        const ADMIN_EMAIL = "gaulestore.np@gmail.com";
        const defaultLogoHtml = `<img src="logo.png" alt="Logo" class="w-full h-full object-cover">`;

        let adminLogoHtml = localStorage.getItem('admin_logo_html') || defaultLogoHtml;
        document.getElementById('adminLogoContainer').innerHTML = adminLogoHtml;

        function handleAdminLogoSelected(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                adminLogoHtml = `<img src="${e.target.result}" class="w-full h-full object-cover" alt="Admin Logo">`;
                localStorage.setItem('admin_logo_html', adminLogoHtml);
                document.getElementById('adminLogoContainer').innerHTML = adminLogoHtml;
            };
            reader.readAsDataURL(file);
        }

        function loginWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).catch((error) => alert("Login Error: " + error.message));
        }

        function logoutGoogle() {
            auth.signOut().then(() => window.location.reload());
        }

        let customers = [];
        let activeCustomerId = null;
        let currentUser = null;
        let isAdmin = false;
        let messagesRef = null;

        const sidebar = document.getElementById('sidebar');
        const openSidebarBtn = document.getElementById('openSidebar');
        const closeSidebarBtn = document.getElementById('closeSidebar');
        const themeToggleTop = document.getElementById('themeToggleTop');
        const chatListContainer = document.getElementById('chatList');
        const messageContainer = document.getElementById('messageContainer');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const micBtn = document.getElementById('micBtn');
        const recordingUI = document.getElementById('recordingUI');
        const recordingTimer = document.getElementById('recordingTimer');

        themeToggleTop.addEventListener('click', toggleTheme);
        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            localStorage.theme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
        }
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }

        openSidebarBtn.addEventListener('click', () => sidebar.classList.remove('-translate-x-full'));
        closeSidebarBtn.addEventListener('click', () => sidebar.classList.add('-translate-x-full'));

        auth.onAuthStateChanged((user) => {
            currentUser = user;
            const googleLoginBtn = document.getElementById('googleLoginBtn');
            const customerProfileView = document.getElementById('customerProfileView');

            if (user) {
                googleLoginBtn.classList.add('hidden');
                customerProfileView.classList.remove('hidden');
                customerProfileView.classList.add('flex');
                document.getElementById('loggedInCustomerPhoto').src = user.photoURL || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150';
                document.getElementById('loggedInCustomerName').innerText = user.displayName || 'User';
                document.getElementById('loggedInCustomerEmail').innerText = user.email || '';

                isAdmin = (user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase());

                messageInput.disabled = false;
                messageInput.placeholder = "Type your message...";
                messageInput.classList.remove('opacity-60');
                sendBtn.disabled = false;
                sendBtn.classList.remove('cursor-not-allowed', 'opacity-50', 'bg-yellow-600/50');
                sendBtn.classList.add('bg-yellow-600', 'hover:bg-yellow-700');
                micBtn.disabled = false;
                micBtn.classList.remove('cursor-not-allowed', 'opacity-60');

                if (isAdmin) {
                    sidebar.classList.remove('hidden');
                    openSidebarBtn.classList.remove('hidden');
                    loadAllCustomersForAdmin();
                } else {
                    sidebar.classList.add('hidden');
                    openSidebarBtn.classList.add('hidden');
                    activeCustomerId = user.uid;

                    rtdb.ref('chats/' + user.uid).update({
                        customerName: user.displayName || 'Google Customer',
                        customerEmail: user.email || '',
                        customerPhoto: user.photoURL || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150',
                        status: 'online',
                        lastMsg: 'Started conversation',
                        lastTime: getCurrentTime(),
                        lastTimestamp: firebase.database.ServerValue.TIMESTAMP
                    });

                    listenToCustomerMessages(user.uid);
                }
            } else {
                googleLoginBtn.classList.remove('hidden');
                customerProfileView.classList.add('hidden');
                sidebar.classList.add('hidden');
                openSidebarBtn.classList.add('hidden');
                
                activeCustomerId = null;
                messageInput.disabled = true;
                messageInput.placeholder = "Please login with Google to type...";
                messageInput.classList.add('opacity-60');
                sendBtn.disabled = true;
                sendBtn.classList.add('cursor-not-allowed', 'bg-yellow-600/50');
                sendBtn.classList.remove('bg-yellow-600', 'hover:bg-yellow-700');
                micBtn.disabled = true;

                messageContainer.innerHTML = `
                    <div class="flex justify-center">
                        <span class="px-4 py-2 bg-amber-50 dark:bg-amber-950/40 text-amber-700 dark:text-amber-300 text-xs rounded-xl shadow-sm border border-amber-200 dark:border-amber-900 font-medium text-center">
                            <i class="fa-solid fa-lock mr-1"></i> Please click <b>'Login with Google'</b> on the top right to start chatting securely.
                        </span>
                    </div>
                `;
            }
        });

        function loadAllCustomersForAdmin() {
            rtdb.ref('chats').on('value', (snapshot) => {
                customers = [];
                snapshot.forEach((childSnapshot) => {
                    const data = childSnapshot.val();
                    customers.push({
                        id: childSnapshot.key,
                        name: data.customerName || 'Customer',
                        email: data.customerEmail || '',
                        avatar: data.customerPhoto || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150',
                        status: data.status || 'online',
                        time: data.lastTime || 'Just now',
                        timestamp: data.lastTimestamp || 0,
                        lastMsg: data.lastMsg || 'No messages yet'
                    });
                });

                // Sort newest message to top
                customers.sort((a, b) => b.timestamp - a.timestamp);

                if (customers.length > 0 && !activeCustomerId) {
                    activeCustomerId = customers[0].id;
                }

                renderAdminCustomerList(document.getElementById('searchCustomer').value);
                if (activeCustomerId && isAdmin) {
                    listenToCustomerMessages(activeCustomerId);
                }
            });
        }

        function renderAdminCustomerList(filterText = '') {
            chatListContainer.innerHTML = '';
            const filtered = customers.filter(c => c.name.toLowerCase().includes(filterText.toLowerCase()) || c.email.toLowerCase().includes(filterText.toLowerCase()));

            if(filtered.length === 0) {
                chatListContainer.innerHTML = `<div class="p-6 text-center text-xs text-slate-400">No customers found.</div>`;
                return;
            }

            filtered.forEach(customer => {
                const isActive = customer.id === activeCustomerId;
                const activeClass = isActive ? 'bg-yellow-50/70 dark:bg-yellow-900/20 border-l-4 border-yellow-500' : 'hover:bg-slate-50 dark:hover:bg-slate-700/50';
                const dotColor = customer.status === 'online' ? 'bg-emerald-500' : 'bg-slate-400';

                const html = `
                    <div onclick="switchAdminChat('${customer.id}')" class="p-3 cursor-pointer flex items-center space-x-3 transition-colors ${activeClass}">
                        <div class="relative flex-shrink-0">
                            <img class="w-12 h-12 rounded-full object-cover ring-1 ring-slate-200 dark:ring-slate-700" src="${customer.avatar}" alt="${customer.name}">
                            <span class="absolute bottom-0 right-0 w-3.5 h-3.5 ${dotColor} border-2 border-white dark:border-slate-800 rounded-full"></span>
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="flex justify-between items-baseline mb-0.5">
                                <h3 class="font-semibold text-slate-900 dark:text-white truncate text-sm">${customer.name}</h3>
                                <span class="text-[10px] text-slate-400">${customer.time}</span>
                            </div>
                            <p class="text-[11px] text-yellow-600 dark:text-yellow-400 truncate mb-0.5">${customer.email}</p>
                            <p class="text-xs text-slate-500 dark:text-slate-400 truncate">${customer.lastMsg}</p>
                        </div>
                    </div>
                `;
                chatListContainer.insertAdjacentHTML('beforeend', html);
            });
        }

        document.getElementById('searchCustomer').addEventListener('input', (e) => {
            renderAdminCustomerList(e.target.value);
        });

        function switchAdminChat(id) {
            activeCustomerId = id;
            renderAdminCustomerList(document.getElementById('searchCustomer').value);
            listenToCustomerMessages(activeCustomerId);
            if (window.innerWidth < 768) {
                sidebar.classList.add('-translate-x-full');
            }
        }

        function listenToCustomerMessages(customerId) {
            if (messagesRef) messagesRef.off();

            messagesRef = rtdb.ref('chats/' + customerId + '/messages');
            messagesRef.on('value', (snapshot) => {
                let messagesList = [];
                snapshot.forEach((childSnapshot) => {
                    messagesList.push(childSnapshot.val());
                });
                renderMessagesUI(messagesList);
            });
        }

        function renderMessagesUI(messages) {
            messageContainer.innerHTML = `
                <div class="flex justify-center">
                    <span class="px-3 py-1 bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-400 text-xs rounded-full shadow-sm font-medium">Secure Chat Session</span>
                </div>
            `;

            const customerAvatar = isAdmin ? (customers.find(c => c.id === activeCustomerId)?.avatar || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150') : currentUser.photoURL;
            const customerName = isAdmin ? (customers.find(c => c.id === activeCustomerId)?.name || 'Customer') : currentUser.displayName;

            // Force admin avatar to always be logo.png for customers, and keep admin logo for admin view
            const adminAvatarHtml = `<img src="logo.png" class="w-full h-full object-cover" alt="Admin Logo">`;

            messages.forEach(msg => {
                const isMyMessage = (isAdmin && msg.sender === 'admin') || (!isAdmin && msg.sender === 'customer');

                if (isMyMessage) {
                    // --- MY MESSAGE (RIGHT SIDE) ---
                    if (msg.type === 'text') {
                        messageContainer.insertAdjacentHTML('beforeend', `
                            <div class="flex items-end justify-end space-x-2 animate-fadeIn">
                                <div class="max-w-[75%] sm:max-w-md bg-yellow-600 text-white rounded-2xl rounded-br-sm p-3.5 shadow-sm">
                                    <p class="text-sm leading-relaxed">${escapeHtml(msg.text)}</p>
                                    <div class="flex items-center justify-end space-x-1 mt-1">
                                        <span class="text-[10px] text-yellow-100">${msg.time}</span>
                                        <i class="fa-solid fa-check-double text-[10px] text-yellow-200"></i>
                                    </div>
                                </div>
                                <div class="w-8 h-8 rounded-full overflow-hidden flex-shrink-0 bg-slate-900 mb-1 flex items-center justify-center ring-1 ring-yellow-500">
                                    ${isAdmin ? adminAvatarHtml : `<img src="logo.png" class="w-full h-full object-cover" alt="Admin Logo">`}
                                </div>
                            </div>
                        `);
                    } else if (msg.type === 'image') {
                        messageContainer.insertAdjacentHTML('beforeend', `
                            <div class="flex items-end justify-end space-x-2 animate-fadeIn">
                                <div class="max-w-[70%] sm:max-w-xs flex flex-col items-end">
                                    <div class="rounded-xl overflow-hidden shadow-md bg-black/5 dark:bg-white/5 mb-1">
                                        <img src="${msg.url}" alt="Sent Photo" class="w-full h-auto object-cover max-h-72 cursor-pointer hover:opacity-95" onclick="window.open('${msg.url}')">
                                    </div>
                                    <div class="flex items-center space-x-1 text-slate-400 pr-1">
                                        <span class="text-[10px]">${msg.time}</span>
                                        <i class="fa-solid fa-check-double text-[10px] text-yellow-500"></i>
                                    </div>
                                </div>
                                <div class="w-8 h-8 rounded-full overflow-hidden flex-shrink-0 bg-slate-900 mb-1 flex items-center justify-center ring-1 ring-yellow-500">
                                    ${isAdmin ? adminAvatarHtml : `<img src="logo.png" class="w-full h-full object-cover" alt="Admin Logo">`}
                                </div>
                            </div>
                        `);
                    } else if (msg.type === 'audio') {
                        messageContainer.insertAdjacentHTML('beforeend', `
                            <div class="flex items-end justify-end space-x-2 animate-fadeIn">
                                <div class="max-w-[75%] sm:max-w-md bg-yellow-600 text-white rounded-2xl rounded-br-sm p-3.5 shadow-sm">
                                    <div class="flex items-center space-x-3 mb-1">
                                        <audio controls src="${msg.url}" class="h-9 w-48 sm:w-64"></audio>
                                    </div>
                                    <div class="flex items-center justify-end space-x-1">
                                        <span class="text-[10px] text-yellow-100">${msg.time}</span>
                                        <i class="fa-solid fa-check-double text-[10px] text-yellow-200"></i>
                                    </div>
                                </div>
                                <div class="w-8 h-8 rounded-full overflow-hidden flex-shrink-0 bg-slate-900 mb-1 flex items-center justify-center ring-1 ring-yellow-500">
                                    ${isAdmin ? adminAvatarHtml : `<img src="logo.png" class="w-full h-full object-cover" alt="Admin Logo">`}
                                </div>
                            </div>
                        `);
                    }
                } else {
                    // --- OTHER PARTY'S MESSAGE (LEFT SIDE) ---
                    // If current user is a customer, the other party sending left-side messages is the Admin. Hence show logo.png!
                    const leftAvatar = isAdmin ? customerAvatar : 'logo.png';
                    const leftName = isAdmin ? customerName : 'Support Center';

                    if (msg.type === 'text') {
                        messageContainer.insertAdjacentHTML('beforeend', `
                            <div class="flex items-end space-x-2 animate-fadeIn">
                                <img class="w-8 h-8 rounded-full object-cover mb-1 flex-shrink-0 ring-1 ring-slate-300 dark:ring-slate-700" src="${leftAvatar}" alt="${leftName}">
                                <div class="max-w-[75%] sm:max-w-md bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-200 rounded-2xl rounded-bl-sm p-3.5 shadow-sm border border-slate-100 dark:border-slate-700/60">
                                    <p class="text-sm leading-relaxed">${escapeHtml(msg.text)}</p>
                                    <span class="block text-[10px] text-slate-400 text-right mt-1">${msg.time}</span>
                                </div>
                            </div>
                        `);
                    } else if (msg.type === 'image') {
                        messageContainer.insertAdjacentHTML('beforeend', `
                            <div class="flex items-end space-x-2 animate-fadeIn">
                                <img class="w-8 h-8 rounded-full object-cover mb-1 flex-shrink-0 ring-1 ring-slate-300 dark:ring-slate-700" src="${leftAvatar}" alt="${leftName}">
                                <div class="max-w-[70%] sm:max-w-xs flex flex-col items-start">
                                    <div class="rounded-xl overflow-hidden shadow-md bg-black/5 dark:bg-white/5 mb-1">
                                        <img src="${msg.url}" alt="Attachment" class="w-full h-auto object-cover max-h-72 cursor-pointer hover:opacity-95" onclick="window.open('${msg.url}')">
                                    </div>
                                    <span class="text-[10px] text-slate-400 pl-1">${msg.time}</span>
                                </div>
                            </div>
                        `);
                    } else if (msg.type === 'audio') {
                        messageContainer.insertAdjacentHTML('beforeend', `
                            <div class="flex items-end space-x-2 animate-fadeIn">
                                <img class="w-8 h-8 rounded-full object-cover mb-1 flex-shrink-0 ring-1 ring-slate-300 dark:ring-slate-700" src="${leftAvatar}" alt="${leftName}">
                                <div class="max-w-[75%] sm:max-w-md bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-200 rounded-2xl rounded-bl-sm p-3.5 shadow-sm border border-slate-100 dark:border-slate-700/60">
                                    <div class="flex items-center space-x-3 mb-1">
                                        <audio controls src="${msg.url}" class="h-9 w-48 sm:w-64"></audio>
                                    </div>
                                    <span class="block text-[10px] text-slate-400 text-right mt-1">${msg.time}</span>
                                </div>
                            </div>
                        `);
                    }
                }
            });
            scrollToBottom();
        }

        function handleSendMessage(e) {
            e.preventDefault();
            const text = messageInput.value.trim();
            if (!text || !activeCustomerId || !currentUser) return;

            const senderRole = isAdmin ? 'admin' : 'customer';
            const timeStr = getCurrentTime();
            const messageData = {
                sender: senderRole,
                type: 'text',
                text: text,
                time: timeStr
            };

            const newMsgRef = rtdb.ref('chats/' + activeCustomerId + '/messages').push();
            newMsgRef.set(messageData).then(() => {
                rtdb.ref('chats/' + activeCustomerId).update({
                    lastMsg: (isAdmin ? 'Admin: ' : '') + text,
                    lastTime: timeStr,
                    lastTimestamp: firebase.database.ServerValue.TIMESTAMP
                });
                messageInput.value = '';
            }).catch(err => alert("Error: " + err.message));
        }

        function handleGalleryPhotoSelected(event) {
            const file = event.target.files[0];
            if (!file || !activeCustomerId || !currentUser) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const photoUrl = e.target.result;
                const senderRole = isAdmin ? 'admin' : 'customer';
                const timeStr = getCurrentTime();
                const messageData = {
                    sender: senderRole,
                    type: 'image',
                    url: photoUrl,
                    time: timeStr
                };

                rtdb.ref('chats/' + activeCustomerId + '/messages').push().set(messageData);
                rtdb.ref('chats/' + activeCustomerId).update({
                    lastMsg: '📷 Photo attachment',
                    lastTime: timeStr,
                    lastTimestamp: firebase.database.ServerValue.TIMESTAMP
                });
            };
            reader.readAsDataURL(file);
            event.target.value = '';
        }

        let mediaRecorder;
        let audioChunks = [];
        let recordingInterval;
        let secondsCount = 0;
        let isRecording = false;

        async function toggleRecording() {
            if (!currentUser || !activeCustomerId) return;
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = event => {
                        if (event.data.size > 0) audioChunks.push(event.data);
                    };

                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.readAsDataURL(audioBlob);
                        reader.onloadend = function() {
                            sendAudioMessageToRTDB(reader.result);
                        };
                        stream.getTracks().forEach(track => track.stop());
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    recordingUI.classList.remove('hidden');
                    recordingUI.classList.add('flex');
                    document.getElementById('micBtn').classList.add('bg-red-500', 'text-white', 'animate-pulse');

                    secondsCount = 0;
                    updateTimerDisplay();
                    recordingInterval = setInterval(() => {
                        secondsCount++;
                        updateTimerDisplay();
                    }, 1000);
                } catch (err) {
                    alert('Microphone access denied!');
                }
            } else {
                stopAndSendRecording();
            }
        }

        function updateTimerDisplay() {
            const mins = Math.floor(secondsCount / 60).toString().padStart(2, '0');
            const secs = (secondsCount % 60).toString().padStart(2, '0');
            recordingTimer.innerText = `${mins}:${secs}`;
        }

        function stopAndSendRecording() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                resetRecordingState();
            }
        }

        function cancelRecording() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.onstop = null;
                mediaRecorder.stop();
                mediaRecorder.stream.getTracks().forEach(track => track.stop());
                resetRecordingState();
            }
        }

        function resetRecordingState() {
            isRecording = false;
            clearInterval(recordingInterval);
            recordingUI.classList.add('hidden');
            recordingUI.classList.remove('flex');
            document.getElementById('micBtn').classList.remove('bg-red-500', 'text-white', 'animate-pulse');
        }

        function sendAudioMessageToRTDB(audioUrl) {
            if(!activeCustomerId || !currentUser) return;
            const senderRole = isAdmin ? 'admin' : 'customer';
            const timeStr = getCurrentTime();
            const messageData = {
                sender: senderRole,
                type: 'audio',
                url: audioUrl,
                time: timeStr
            };

            rtdb.ref('chats/' + activeCustomerId + '/messages').push().set(messageData);
            rtdb.ref('chats/' + activeCustomerId).update({
                lastMsg: '🎙️ Voice message',
                lastTime: timeStr,
                lastTimestamp: firebase.database.ServerValue.TIMESTAMP
            });
        }

        function scrollToBottom() {
            messageContainer.scrollTop = messageContainer.scrollHeight;
        }

        function getCurrentTime() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = now.getMinutes().toString().padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12 || 12;
            return `${hours}:${minutes} ${ampm}`;
        }

        function escapeHtml(text> {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, m => map[m]);
        }
    </script>
</body>
</html>
