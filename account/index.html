<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="canonical" href="https://roshantamang2.com.np/account/" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile | RG DIGITAL STORE</title>
    <meta property="og:image" content="https://roshantamang2.com.np/owner.png">
    <link rel="icon" href="../owner.png" type="image/png">
    
    <!-- FontAwesome CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #2563EB;
            --primary-dark: #1E40AF;
            --primary-light: #EFF6FF;
            --success: #10B981;
            --danger: #EF4444;
            --text-main: #0F172A;
            --text-muted: #64748B;
            --bg-body: #f0f4f9;
            --card-bg: #FFFFFF;
            --border-color: #E2E8F0;
        }

        body { 
            font-family: 'Inter', system-ui, -apple-system, sans-serif; 
            margin: 0; 
            background-color: var(--bg-body); 
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 24px 24px;
            color: var(--text-main);
            padding-bottom: 90px; 
            box-sizing: border-box; 
        }
        
        /* Modern Glass Header */
        .header { 
            display: flex; 
            align-items: center; 
            padding: 14px 28px; 
            background: rgba(255, 255, 255, 0.95); 
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color); 
            justify-content: space-between; 
            position: sticky; 
            top: 0; 
            z-index: 1000; 
        }
        .header-right { 
            display: flex; 
            align-items: center; 
            gap: 12px; 
        }
        .header-wallet {
            display: flex;
            align-items: center;
            gap: 6px;
            background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
            border: 1px solid #bfdbfe;
            color: var(--primary);
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
            box-shadow: 0 2px 6px rgba(37,99,235,0.08);
        }
        .header-wallet svg { width: 16px; height: 16px; fill: var(--primary); }
        .store-logo { height: 40px; width: auto; object-fit: contain; display: block; border-radius: 6px; background-color: #ffffff; padding: 4px; }
        #header-user-img { width: 38px; height: 38px; border-radius: 50%; cursor: pointer; border: 2px solid var(--primary); object-fit: cover; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

        /* Profile Main Wrapper */
        .profile-container {
            width: 92%;
            max-width: 480px;
            margin: 24px auto 16px auto;
        }

        /* Profile Top Banner & Avatar */
        .profile-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 28px;
            text-align: center;
            box-shadow: 0 6px 20px rgba(15, 23, 42, 0.04);
            border: 1px solid var(--border-color);
            position: relative;
        }

        .profile-avatar-container {
            display: flex;
            justify-content: center;
            margin-bottom: 14px;
        }
        .profile-avatar {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            border: 4px solid #ffffff;
            object-fit: cover;
            background: #ffffff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .user-greeting {
            font-size: 20px;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 6px;
        }
        .user-email-text {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 10px;
        }
        .available-balance-text {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-muted);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .available-balance-text i {
            cursor: pointer;
            color: var(--primary);
            transition: transform 0.3s;
        }
        .available-balance-text i:hover {
            transform: rotate(180deg);
        }

        /* 4 Stats Grid Box */
        .stats-grid-4 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            width: 92%;
            max-width: 480px;
            margin: 20px auto;
        }
        .stat-box-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 22px 16px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(15, 23, 42, 0.03);
            border: 1px solid var(--border-color);
        }
        .stat-box-value {
            font-size: 22px;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 6px;
        }
        .stat-box-label {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

        /* Section Cards */
        .section-box {
            width: 92%;
            max-width: 480px;
            margin: 20px auto;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 28px;
            box-shadow: 0 6px 20px rgba(15, 23, 42, 0.04);
            border: 1px solid var(--border-color);
            box-sizing: border-box;
        }
        .section-header {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 15px;
            font-weight: 800;
            color: var(--text-muted);
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }
        .section-header i { 
            color: var(--primary); 
            background: var(--primary-light);
            padding: 10px;
            border-radius: 12px;
            font-size: 16px;
        }

        /* Balance Inner Card */
        .balance-inner-card {
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 20px;
            text-align: center;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }
        .balance-inner-amount {
            font-size: 24px;
            font-weight: 800;
            color: var(--text-main);
            margin-top: 6px;
        }

        /* Account Status Card */
        .verified-card {
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 18px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
            margin-bottom: 16px;
        }
        .verified-icon-badge {
            width: 40px;
            height: 40px;
            background: #eff6ff;
            color: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        .verified-title {
            font-size: 15px;
            font-weight: 800;
            color: var(--text-main);
        }

        /* Logout Button */
        .logout-btn {
            width: 100%;
            background: #fef2f2;
            color: var(--danger);
            border: 1px solid #fecaca;
            padding: 14px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.2s;
        }
        .logout-btn:hover {
            background: #fee2e2;
        }

        /* Social Icons Styles with White Background & Border */
        .social-container-box {
            width: 92%;
            max-width: 480px;
            margin: 24px auto;
            text-align: center;
        }
        .social-title {
            font-size: 15px;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .social-icons-container { 
            display: flex; 
            justify-content: center; 
            gap: 16px; 
            align-items: center; 
            padding: 10px; 
        }
        .social-icon-btn {
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 14px;
            width: 52px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.04);
            transition: all 0.2s ease-in-out;
            text-decoration: none;
        }
        .social-icon-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(15, 23, 42, 0.08);
            border-color: #cbd5e1;
            background: #f8fafc;
        }

        /* Bottom Nav Bar */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #ffffff;
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 62px;
            border-top: 1px solid #eaeaea;
            padding: 0 5px;
            z-index: 1000;
            box-sizing: border-box;
        }
        .bottom-nav .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #888;
            font-size: 11px;
            font-weight: 500;
            flex: 1;
            height: 100%;
            transition: all 0.2s ease-in-out;
            background: transparent;
            border: none;
        }
        .bottom-nav .nav-item svg { width: 18px; height: 18px; margin-bottom: 3px; stroke: currentColor; fill: none; }
        .bottom-nav .nav-item.active { color: #333333; }

        /* DESKTOP RESPONSIVE STYLES (Expanded Full Size Layout) */
        @media (min-width: 768px) {
            .profile-container,
            .stats-grid-4,
            .section-box,
            .social-container-box {
                max-width: 960px !important;
            }
            .stats-grid-4 {
                grid-template-columns: repeat(4, 1fr) !important;
            }
            body {
                padding-bottom: 80px;
            }
        }
    </style>
</head>

<!-- Firebase & Script Integration -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCFUQu06EvmJCtplZ8dRqVhHnB7I1yQuKw",
      authDomain: "rg-digital-store.firebaseapp.com",
      databaseURL: "https://rg-digital-store-default-rtdb.firebaseio.com",
      projectId: "rg-digital-store",
      storageBucket: "rg-digital-store.firebasestorage.app",
      messagingSenderId: "257332660691",
      appId: "1:257332660691:web:e9ff5e85282a4e9d1d4726",
      measurementId: "G-S09Q860R4V"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    // Authentication State Listener
    onAuthStateChanged(auth, (user) => {
        if (user) {
            // Logged In User Data
            const photoUrl = user.photoURL || `https://ui-avatars.com/api/?name=${encodeURIComponent(user.displayName || "User")}&background=2563EB&color=fff`;
            document.getElementById("profile-avatar").src = photoUrl;
            document.getElementById("header-user-img").src = photoUrl;
            document.getElementById("profile-name").innerText = user.displayName || "User";
            document.getElementById("profile-email").innerText = user.email || "No email linked";
            
            const shortPin = user.uid.substring(0, 5).toUpperCase();
            document.getElementById("stat-pin").innerText = shortPin;
            document.getElementById("auth-status-text").innerText = "Account Verified";

            // Fetch user wallet balance from database
            const userRef = ref(db, 'users/' + user.uid);
            onValue(userRef, (snapshot) => {
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    const bal = data.balance || 0;

                    document.getElementById("header-balance").innerText = bal;
                    document.getElementById("sub-balance").innerText = bal;
                    document.getElementById("account-balance").innerText = parseFloat(bal).toFixed(2);
                }
            });

            // Fetch orders and calculate Total Spent & Weekly Spent
            const ordersRef = ref(db, 'orders');
            onValue(ordersRef, (snapshot) => {
                if (snapshot.exists()) {
                    let orderCount = 0;
                    let totalSpent = 0;
                    let weeklySpent = 0;

                    const oneWeekAgo = Date.now() - (7 * 24 * 60 * 60 * 1000);

                    snapshot.forEach((childSnap) => {
                        const order = childSnap.val();
                        if (order.userId === user.uid || order.email === user.email) {
                            orderCount++;
                            if ((order.status || "").toLowerCase() === "complete") {
                                const amount = parseFloat(order.amountDue) || 0;
                                totalSpent += amount;

                                const orderTime = order.createdAt || order.timestamp || 0;
                                if (orderTime >= oneWeekAgo) {
                                    weeklySpent += amount;
                                }
                            }
                        }
                    });

                    document.getElementById("stat-orders").innerText = orderCount;
                    document.getElementById("stat-spent").innerText = totalSpent.toLocaleString() + " RS";
                    document.getElementById("stat-weekly").innerText = weeklySpent.toLocaleString() + " RS";
                }
            });
        } else {
            // Not Logged In -> Redirect to Login Page
            window.location.href = "https://roshantamang2.com.np/login/";
        }
    });

    // Handle Logout functionality
    document.getElementById("logout-btn").addEventListener("click", () => {
        if (confirm("Are you sure you want to log out?")) {
            signOut(auth).then(() => {
                window.location.href = "https://roshantamang2.com.np/login/";
            }).catch((error) => {
                alert("Error signing out: " + error.message);
            });
        }
    });
</script>

</body>
</html>
