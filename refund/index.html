<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaule Store - Auto Top-up Center</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 { text-align: center; color: #ff4757; }
        .form-group {
            margin-bottom: 15px;
        }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
        }
        .error-border { border-color: #ff4757 !important; }
        .error-text { color: #ff4757; font-size: 12px; display: none; margin-top: 5px; }
        button {
            width: 100%;
            background-color: #ff4757;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        button:hover:not(:disabled) { background-color: #ff6b81; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Gaule Store Top-Up</h2>
        
        <div class="form-group">
            <label for="game-uid">Player ID (UID)</label>
            <input type="text" id="game-uid" placeholder="Enter your Game UID">
        </div>

        <div class="form-group">
            <label for="item-select">Select Item</label>
            <select id="item-select">
                <option value="Weekly Membership|175">Weekly Membership (Rs 175)</option>
                <option value="Monthly Membership|850">Monthly Membership (Rs 850)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="txid-input">Transaction ID (TXID)</label>
            <input type="text" id="txid-input" placeholder="Enter Payment TXID">
            <div id="txid-error" class="error-text">Please enter a valid Transaction ID.</div>
        </div>

        <button id="submit-btn" onclick="submitPayment()">Submit Payment</button>
    </div>

    <!-- Firebase SDK Setup -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, set, get, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // यहाँ तपाईंको Firebase कन्फिगरेसन राखिएको छ
        const firebaseConfig = {
            databaseURL: "https://gaule-top-up-center-default-rtdb.firebaseio.com/"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let currentUser = null; // यदि लगइन सिस्टम छ भने यहाँ सेट गर्न सक्नुहुन्छ

        window.submitPayment = async function() {
            const gameUidInput = document.getElementById('game-uid');
            const txidInput = document.getElementById('txid-input');
            const txidError = document.getElementById('txid-error');
            const itemSelect = document.getElementById('item-select');
            const submitBtn = document.getElementById('submit-btn');

            let txidValue = txidInput.value.trim();
            let uidValue = gameUidInput.value.trim();
            
            if (uidValue === "") {
                alert("Please enter Game UID!");
                gameUidInput.focus();
                return;
            }

            if (txidValue === "") {
                txidInput.classList.add('error-border');
                txidError.style.display = "block";
                txidInput.focus();
                return;
            } else {
                txidInput.classList.remove('error-border');
                txidError.style.display = "none";
            }
            
            // बटन दोहोरो क्लिक हुनबाट रोक्ने (Duplicate Guard)
            if (submitBtn.disabled) return;
            submitBtn.disabled = true;
            submitBtn.innerText = "Submitting...";

            // Render ब्याकएन्डलाई जगाउन (Warm-up Ping)
            fetch('https://gaule-store.onrender.com/').catch(e => console.log("Waking Render..."));

            const now = new Date();
            const selectedValue = itemSelect.value.split('|');
            const currentItem = selectedValue[0];
            const selectedItemPrice = selectedValue[1];

            let itemNameLower = currentItem.toLowerCase();
            let isMembership = itemNameLower.includes('weekly') || itemNameLower.includes('monthly');
            let membershipType = itemNameLower.includes('monthly') ? 'monthly' : 'weekly';

            // १. स्टक (Voucher) चेक गर्ने
            if (isMembership) {
                try {
                    const voucherRef = ref(db, `auto-top-up/${membershipType}`);
                    const snapshot = await get(voucherRef);

                    if (!snapshot.exists() || !snapshot.val() || Object.keys(snapshot.val()).length === 0) {
                        alert("Out of Stock! यो मेम्बरसिपको भौचर स्टकमा उपलब्ध छैन।");
                        submitBtn.disabled = false;
                        submitBtn.innerText = "Submit Payment";
                        return; 
                    }
                } catch (e) {
                    console.error("Voucher Check Error:", e);
                }
            }

            const orderRef = push(ref(db, 'orders'));
            
            try {
                // २. अर्डर Firebase मा 'Pending' सेभ गर्ने
                await set(orderRef, {
                    date: now.toLocaleDateString(),
                    time: now.toLocaleTimeString(),
                    timestamp: Date.now(),
                    email: currentUser ? currentUser.email : "Guest",
                    name: currentUser ? (currentUser.displayName || "User") : "User",
                    userId: currentUser ? currentUser.uid : "GuestUID",
                    product: currentItem,
                    amountDue: selectedItemPrice,
                    uid: uidValue,
                    transactionId: txidValue,
                    status: "Pending"
                });

                alert("Order submitted successfully! Top-up processing...");

                // ३. ५ सेकेन्डपछि Render मा Request पठाउने
                if (isMembership) {
                    console.log("Triggering Auto Topup in 5s for:", currentItem);
                    setTimeout(() => {
                        processAutoTopUpApi(uidValue, membershipType, orderRef, currentItem);
                    }, 5000);
                }

                // फर्म खाली गर्ने र बटन पुनः सक्रिय बनाउने
                txidInput.value = "";
                gameUidInput.value = "";
                submitBtn.disabled = false;
                submitBtn.innerText = "Submit Payment";

            } catch (error) {
                alert("अर्डर पठाउन समस्या भयो: " + error.message);
                submitBtn.disabled = false;
                submitBtn.innerText = "Submit Payment";
            }
        };

        // Render API मा Request पठाउने र Voucher हटाउने फङ्‍सन
        async function processAutoTopUpApi(playerId, membershipType, orderRef, packName) {
            try {
                const voucherRef = ref(db, `auto-top-up/${membershipType}`);
                const snapshot = await get(voucherRef);

                if (!snapshot.exists()) {
                    console.log("No vouchers found in database!");
                    return;
                }

                const vouchers = snapshot.val();
                const voucherKeys = Object.keys(vouchers);
                if (voucherKeys.length === 0) {
                    console.log("Voucher list is empty!");
                    return;
                }

                const selectedKey = voucherKeys[0];
                const voucherCode = vouchers[selectedKey];
                if (!voucherCode) return;

                console.log("Sending Request to Render Backend for:", packName);

                // सिधै तपाईंको Render ब्याकएन्डमा फेच गर्ने
                const response = await fetch('https://gaule-store.onrender.com/api/process-topup', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        orderid: "GAULE_" + Date.now(),
                        playerid: playerId,
                        code: voucherCode,
                        url: "https://gaule-store.onrender.com/api/webhook"
                    })
                });

                const responseText = await response.text();
                console.log("Render Response:", responseText);

                let result = JSON.parse(responseText);

                if (result.status === 'success' || result.status === 200 || result.success) {
                    // प्रयोग भइसकेको भौचर हटाउने
                    await remove(ref(db, `auto-top-up/${membershipType}/${selectedKey}`));
                    // Status Completed बनाउने
                    await set(ref(db, `orders/${orderRef.key}/status`), "Completed");
                    console.log("Top Up Completed & Voucher Deleted Successfully!");
                } else {
                    console.error("Top Up Failed from API:", result);
                }
            } catch (err) {
                console.error("Auto Top Up Process Error:", err);
            }
        }
    </script>
</body>
</html>
