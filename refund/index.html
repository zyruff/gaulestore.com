        .menu-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }

<div class="header">
    <div class="menu-icon" onclick="toggleMenu()">&#9776;</div>
    <div class="store-title">GAULE <span style="color:#dc2626;">STORE</span></div>
    
    <div class="header-right">
        <!-- Login नभएको अवस्थामा देखिने Icon -->
        <div id="login-container" onclick="googleLogin()">
            <svg class="login-svg" viewBox="0 0 24 24" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        </div>

        <!-- Login भएपछि Profile को देब्रेपट्टी देखिने Wallet Balance -->

            <svg viewBox="0 0 24 24">
                <path d="M21 18v1c0 1.1-.9 2-2 2H5c-1.11 0-2-.9-2-2V5c0-1.1.89-2 2-2h14c1.1 0 2 .9 2 2v1h-9c-1.11 0-2 .9-2 2v8c0 1.1.89 2 2 2h9zm-9-2h10V8H12v8zm4-2.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/>
            </svg>
            <span>Rs. <span id="header-user-balance">0</span></span>
        </a>

        <!-- Profile Picture -->
        <img id="profile-pic" onclick="toggleProfile()">
        
        <!-- Profile Dropdown -->
        <div id="profile-dropdown">
            <div id="display-name" class="user-name"></div>
            <div id="display-email" class="user-email"></div>
            <a href="my-wallet.html" style="display:block; margin-bottom: 10px; color:#dc2626; font-size:12px; font-weight:bold; text-decoration:none;">My Wallet</a>

</div>

<div id="nav-menu">
    <div class="menu-header">
        <span style="font-weight:bold;">Menu</span>
        <span class="close-btn" onclick="toggleMenu()">&times;</span>
    </div>
    <div class="search-box">
        <input type="text" id="gameSearch" placeholder="Search games..." onkeyup="filterGames()">
        <button onclick="filterGames()">Search</button>
    </div>
    <div id="search-results" style="margin-bottom: 15px; max-height: 200px; overflow-y: auto;"></div>
    <a href="index.html">Home</a>
    <a href="shop/">Shop</a>
    <a href="my-wallet.html">My Wallet</a>
    <a href="https://wa.me/9779761081110" target="_blank">Contact Us</a>
</div>

<div id="content-area" style="padding: 20px;"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBn0kORKJHN_X4uVidhjulK-dAnRujOO3A",
        authDomain: "gaule-top-up-center.firebaseapp.com",
        databaseURL: "https://gaule-top-up-center-default-rtdb.firebaseio.com",
        projectId: "gaule-top-up-center",
        storageBucket: "gaule-top-up-center.firebasestorage.app",
        messagingSenderId: "645605489690",
        appId: "1:645605489690:web:10e333176acd07eec1e5a3"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);
    const provider = new GoogleAuthProvider();

    window.toggleMenu = () => { const m = document.getElementById("nav-menu"); m.style.display = (m.style.display === "block") ? "none" : "block"; };
    window.toggleProfile = () => { const d = document.getElementById("profile-dropdown"); d.style.display = (d.style.display === "block") ? "none" : "block"; };
    window.googleLogin = () => signInWithPopup(auth, provider);
    window.logoutUser = () => signOut(auth).then(() => location.reload());

    onAuthStateChanged(auth, (user) => {
        if (user) {
            // UI Switch on Login
            document.getElementById("login-container").style.display = "none";
            document.getElementById("header-wallet-btn").style.display = "flex"; // Header ma Wallet देखाइदिने
            document.getElementById("profile-pic").style.display = "block";
            document.getElementById("profile-pic").src = user.photoURL;
            document.getElementById("display-name").innerText = user.displayName;
            document.getElementById("display-email").innerText = user.email;

            // Firebase Database बाट balance तान्ने
            const userRef = ref(db, 'users/' + user.uid);
            onValue(userRef, (snapshot) => {
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    document.getElementById("header-user-balance").innerText = data.balance || 0;
                } else {
                    // यदि नयाँ युजर हो भने Database मा create गरी balance 0 राख्ने
                    set(userRef, {
                        name: user.displayName,
                        email: user.email,
                        balance: 0
                    });
                    document.getElementById("header-user-balance").innerText = 0;
                }
            });
        }
    });
</script>
</body>
</html>







<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaule Store - Auto Top-up Center</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 { text-align: center; color: #ff4757; }
        .form-group {
            margin-bottom: 15px;
        }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
        }
        .error-border { border-color: #ff4757 !important; }
        .error-text { color: #ff4757; font-size: 12px; display: none; margin-top: 5px; }
        button {
            width: 100%;
            background-color: #ff4757;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        button:hover:not(:disabled) { background-color: #ff6b81; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Gaule Store Top-Up</h2>
        
        <div class="form-group">
            <label for="game-uid">Player ID (UID)</label>
            <input type="text" id="game-uid" placeholder="Enter your Game UID">
        </div>

        <div class="form-group">
            <label for="item-select">Select Item</label>
            <select id="item-select">
                <option value="weekly|175">Weekly Membership (Rs 175)</option>
                <option value="monthly|850">Monthly Membership (Rs 850)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="txid-input">Transaction ID (TXID)</label>
            <input type="text" id="txid-input" placeholder="Enter Payment TXID">
            <div id="txid-error" class="error-text">Please enter a valid Transaction ID.</div>
        </div>

        <button id="submit-btn" onclick="submitPayment()">Submit Payment</button>
    </div>

    <!-- Firebase SDK Setup -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, set, get, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            databaseURL: "https://gaule-top-up-center-default-rtdb.firebaseio.com/"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.submitPayment = async function() {
            const gameUidInput = document.getElementById('game-uid');
            const txidInput = document.getElementById('txid-input');
            const txidError = document.getElementById('txid-error');
            const itemSelect = document.getElementById('item-select');
            const submitBtn = document.getElementById('submit-btn');

            let txidValue = txidInput.value.trim();
            let uidValue = gameUidInput.value.trim();
            
            if (uidValue === "") {
                alert("Please enter Game UID!");
                gameUidInput.focus();
                return;
            }

            if (txidValue === "") {
                txidInput.classList.add('error-border');
                txidError.style.display = "block";
                txidInput.focus();
                return;
            } else {
                txidInput.classList.remove('error-border');
                txidError.style.display = "none";
            }
            
            if (submitBtn.disabled) return;
            submitBtn.disabled = true;
            submitBtn.innerText = "Submitting...";

            // Render ब्याकएन्डलाई जगाउन Warm-up Ping
            fetch('https://gaule-store.onrender.com/').catch(e => console.log("Waking Render..."));

            const now = new Date();
            const selectedValue = itemSelect.value.split('|');
            const membershipType = selectedValue[0]; // 'weekly' या 'monthly' सिधै आउँछ
            const selectedItemPrice = selectedValue[1];
            const currentItem = membershipType === 'weekly' ? 'Weekly Membership' : 'Monthly Membership';

            // १. स्टक (Voucher) चेक गर्ने
            try {
                const voucherRef = ref(db, `auto-top-up/${membershipType}`);
                const snapshot = await get(voucherRef);

                if (!snapshot.exists() || !snapshot.val() || Object.keys(snapshot.val()).length === 0) {
                    alert("Out of Stock! यो मेम्बरसिपको भौचर स्टकमा उपलब्ध छैन।");
                    submitBtn.disabled = false;
                    submitBtn.innerText = "Submit Payment";
                    return; 
                }
            } catch (e) {
                console.error("Voucher Check Error:", e);
            }

            const orderRef = push(ref(db, 'orders'));
            
            try {
                // २. अर्डर Firebase मा 'Pending' सेभ गर्ने
                await set(orderRef, {
                    date: now.toLocaleDateString(),
                    time: now.toLocaleTimeString(),
                    timestamp: Date.now(),
                    email: "Guest",
                    name: "User",
                    product: currentItem,
                    amountDue: selectedItemPrice,
                    uid: uidValue,
                    transactionId: txidValue,
                    status: "Pending"
                });

                alert("Order submitted successfully! Top-up processing...");

                // ३. ५ सेकेन्डपछि Render मा Request पठाउने
                console.log("Triggering Auto Topup in 5s for:", currentItem);
                setTimeout(() => {
                    processAutoTopUpApi(uidValue, membershipType, orderRef, currentItem);
                }, 5000);

                txidInput.value = "";
                gameUidInput.value = "";
                submitBtn.disabled = false;
                submitBtn.innerText = "Submit Payment";

            } catch (error) {
                alert("अर्डर पठाउन समस्या भयो: " + error.message);
                submitBtn.disabled = false;
                submitBtn.innerText = "Submit Payment";
            }
        };

        // Render API मा Request पठाउने र Voucher हटाउने फङ्‍सन
        async function processAutoTopUpApi(playerId, membershipType, orderRef, packName) {
            try {
                const voucherRef = ref(db, `auto-top-up/${membershipType}`);
                const snapshot = await get(voucherRef);

                if (!snapshot.exists()) {
                    console.log("No vouchers found in database!");
                    return;
                }

                const vouchers = snapshot.val();
                const voucherKeys = Object.keys(vouchers);
                if (voucherKeys.length === 0) {
                    console.log("Voucher list is empty!");
                    return;
                }

                const selectedKey = voucherKeys[0]; // जस्तै: v1
                const voucherCode = vouchers[selectedKey]; // जस्तै: "UPBD-N-S-17443686..."
                if (!voucherCode) return;

                console.log("Sending Request to Render Backend for:", packName, "Code:", voucherCode);

                // सिधै Render मा फेच गर्ने
                const response = await fetch('https://gaule-store.onrender.com/api/process-topup', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        orderid: "GAULE_" + Date.now(),
                        playerid: playerId,
                        code: voucherCode,
                        url: "https://gaule-store.onrender.com/api/webhook"
                    })
                });

                const responseText = await response.text();
                console.log("Render Response:", responseText);

                let result = JSON.parse(responseText);

                if (result.status === 'success' || result.status === 200 || result.success) {
                    // प्रयोग भइसकेको भौचर (जस्तै v1) लाई Firebase बाट हटाउने
                    await remove(ref(db, `auto-top-up/${membershipType}/${selectedKey}`));
                    // अर्डरको Status Completed बनाउने
                    await set(ref(db, `orders/${orderRef.key}/status`), "Completed");
                    console.log("Top Up Completed & Voucher Deleted Successfully!");
                } else {
                    console.error("Top Up Failed from API:", result);
                }
            } catch (err) {
                console.error("Auto Top Up Process Error:", err);
            }
        }
    </script>
</body>
</html>
