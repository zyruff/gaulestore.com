<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Gaule Store Top-Up Requests</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background-color: #f1f5f9; color: #1e293b; padding: 20px; }
        
        .admin-container { max-width: 1000px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        h2 { margin-top: 0; color: #0f172a; border-bottom: 2px solid #e2e8f0; padding-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        
        .stats-bar { display: flex; gap: 15px; margin-bottom: 20px; }
        .stat-card { flex: 1; background: #f8fafc; border: 1px solid #cbd5e1; padding: 15px; border-radius: 8px; text-align: center; }
        .stat-card h4 { margin: 0 0 5px 0; color: #64748b; font-size: 13px; text-transform: uppercase; }
        .stat-card div { font-size: 22px; font-weight: 800; color: #dc2626; }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { text-align: left; padding: 12px 15px; border-bottom: 1px solid #e2e8f0; font-size: 14px; }
        th { background-color: #f8fafc; color: #475569; font-weight: 700; }
        
        .badge { padding: 4px 8px; border-radius: 12px; font-size: 12px; font-weight: 700; display: inline-block; }
        .badge-pending { background: #fef3c7; color: #b45309; }
        .badge-approved { background: #dcfce7; color: #15803d; }
        .badge-rejected { background: #fee2e2; color: #b91c1c; }

        .btn { border: none; padding: 6px 12px; border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 12px; margin-right: 5px; transition: opacity 0.2s; }
        .btn:hover { opacity: 0.85; }
        .btn-approve { background: #16a34a; color: white; }
        .btn-reject { background: #dc2626; color: white; }
        
        .no-data { text-align: center; padding: 30px; color: #64748b; font-weight: 600; }
    </style>
</head>
<body>

<div class="admin-container">
    <h2>
        <span>Gaule Store - Wallet Top-Up Requests</span>
        <button onclick="location.reload()" style="padding: 6px 12px; cursor:pointer;">Refresh</button>
    </h2>

    <div class="stats-bar">
        <div class="stat-card">
            <h4>Pending Requests</h4>
            <div id="count-pending">0</div>
        </div>
        <div class="stat-card">
            <h4>Approved Requests</h4>
            <div id="count-approved" style="color:#16a34a;">0</div>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th>User Details</th>
                <th>Method</th>
                <th>Amount</th>
                <th>Transaction ID</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="requests-list">
            <tr><td colspan="6" class="no-data">Loading requests...</td></tr>
        </tbody>
    </table>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getDatabase, ref, onValue, update, runTransaction } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBn0kORKJHN_X4uVidhjulK-dAnRujOO3A",
        authDomain: "gaule-top-up-center.firebaseapp.com",
        databaseURL: "https://gaule-top-up-center-default-rtdb.firebaseio.com",
        projectId: "gaule-top-up-center",
        storageBucket: "gaule-top-up-center.firebasestorage.app",
        messagingSenderId: "645605489690",
        appId: "1:645605489690:web:10e333176acd07eec1e5a3"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    // 1. Realtime Top-up Requests Load गर्ने
    const requestsRef = ref(db, 'topup_requests');
    
    onValue(requestsRef, (snapshot) => {
        const tbody = document.getElementById("requests-list");
        tbody.innerHTML = "";

        if (!snapshot.exists()) {
            tbody.innerHTML = '<tr><td colspan="6" class="no-data">No top-up requests found.</td></tr>';
            return;
        }

        let pendingCount = 0;
        let approvedCount = 0;

        const data = snapshot.val();
        // Request हरूलाई अर्डर मिलाउने (Newest First)
        const keys = Object.keys(data).reverse();

        keys.forEach((reqId) => {
            const item = data[reqId];
            
            if (item.status === "Pending") pendingCount++;
            if (item.status === "Approved") approvedCount++;

            const tr = document.createElement("tr");

            let actionButtons = "";
            if (item.status === "Pending") {
                actionButtons = `
                    <button class="btn btn-approve" onclick="approveRequest('${reqId}', '${item.uid}', ${item.amount})">Approve & Add Balance</button>
                    <button class="btn btn-reject" onclick="rejectRequest('${reqId}')">Reject</button>
                `;
            } else {
                actionButtons = `<span style="color:#64748b; font-size:12px;">Processed</span>`;
            }

            let badgeClass = "badge-pending";
            if (item.status === "Approved") badgeClass = "badge-approved";
            if (item.status === "Rejected") badgeClass = "badge-rejected";

            tr.innerHTML = `
                <td>
                    <b>${item.name || 'User'}</b><br>
                    <small style="color:#64748b;">${item.email || ''}</small>
                </td>
                <td><b>${item.method}</b></td>
                <td><b style="color:#dc2626;">Rs. ${item.amount}</b></td>
                <td><code>${item.transactionId}</code></td>
                <td><span class="badge ${badgeClass}">${item.status}</span></td>
                <td>${actionButtons}</td>
            `;

            tbody.appendChild(tr);
        });

        document.getElementById("count-pending").innerText = pendingCount;
        document.getElementById("count-approved").innerText = approvedCount;
    });

    // 2. Request Approve गर्ने र User Balance थप्ने Function
    window.approveRequest = async (requestId, userUid, amount) => {
        if (!confirm(`Are you sure you want to approve Rs. ${amount} for this user?`)) return;

        const requestRef = ref(db, `topup_requests/${requestId}`);
        const userBalanceRef = ref(db, `users/${userUid}/balance`);

        try {
            // A. Request Status update गर्ने
            await update(requestRef, {
                status: "Approved",
                approvedAt: new Date().toISOString()
            });

            // B. Safe तरिकाले युजरको ब्यालेन्स थप्ने
            await runTransaction(userBalanceRef, (currentBalance) => {
                return (currentBalance || 0) + Number(amount);
            });

            alert("✅ Request Approved and Balance Successfully Added!");
        } catch (err) {
            alert("Error: " + err.message);
        }
    };

    // 3. Request Reject गर्ने Function
    window.rejectRequest = async (requestId) => {
        if (!confirm("Are you sure you want to REJECT this request?")) return;

        const requestRef = ref(db, `topup_requests/${requestId}`);
        try {
            await update(requestRef, {
                status: "Rejected",
                rejectedAt: new Date().toISOString()
            });
            alert("Request Rejected.");
        } catch (err) {
            alert("Error: " + err.message);
        }
    };
</script>

</body>
</html>
