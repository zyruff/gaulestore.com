    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getDatabase, ref, query, orderByChild, equalTo, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBn0kORKJHN_X4uVidhjulK-dAnRujOO3A",
        authDomain: "gaule-top-up-center.firebaseapp.com",
        databaseURL: "https://gaule-top-up-center-default-rtdb.firebaseio.com",
        projectId: "gaule-top-up-center",
        storageBucket: "gaule-top-up-center.firebasestorage.app",
        messagingSenderId: "645605489690",
        appId: "1:645605489690:web:10e333176acd07eec1e5a3"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);
    const provider = new GoogleAuthProvider();

    window.toggleMenu = () => { const m = document.getElementById("nav-menu"); m.style.display = (m.style.display === "block") ? "none" : "block"; };
    window.toggleProfile = () => { const d = document.getElementById("profile-dropdown"); d.style.display = (d.style.display === "block") ? "none" : "block"; };
    window.googleLogin = () => signInWithPopup(auth, provider);
    window.logoutUser = () => signOut(auth).then(() => location.reload());

    window.showOrders = () => {
        toggleMenu();
        const user = auth.currentUser;
        if (!user) return;
        
        const area = document.getElementById("content-area");
        
        // पछाडि फर्किने बटन र हेडिङ
        area.innerHTML = `
            <button onclick="location.reload()" style="margin-bottom:15px; padding:8px 15px; background:#333; color:white; border:none; border-radius:5px; cursor:pointer;">
                ← Back
            </button>
            <h2>My Orders</h2>
        `;

        const ordersRef = query(ref(db, 'orders'), orderByChild('userId'), equalTo(user.uid));
        
        onValue(ordersRef, (snapshot) => {
            // अर्डर सूची देखाउनु अघि 'Back' बटन यथावत राख्न
            let orderHtml = `
                <button onclick="location.reload()" style="margin-bottom:15px; padding:8px 15px; background:#333; color:white; border:none; border-radius:5px; cursor:pointer;">
                    ← Back
                </button>
                <h2>My Orders</h2>
            `;
            
            let orderArray = [];
            snapshot.forEach((s) => { orderArray.push(s.val()); });
            orderArray.reverse(); 

            if (orderArray.length > 0) {
                orderArray.forEach((o) => {
                    let statusColor = '#eab308';
                    if (o.status === 'Complete') statusColor = 'green';
                    else if (o.status === 'Rejected') statusColor = 'red';

                    orderHtml += `
                        <div class="order-card">
                            <p style="font-size: 14px; margin: 3px 0;">Product: <b>${o.product || "N/A"}</b></p>
                            <p style="font-size: 14px; margin: 3px 0;">Player ID: <b>${o.uid || "N/A"}</b></p>
                            <p style="font-size: 14px; margin: 3px 0;">Status: <b style="color:${statusColor}">${o.status}</b></p>
                        </div>`;
                });
                area.innerHTML = orderHtml;
            } else { 
                area.innerHTML = orderHtml + "<p>No Order History</p>"; 
            }
        });
    };


    onAuthStateChanged(auth, (user) => {
        if (user) {
            document.getElementById("my-orders-link").style.display = "block";
            document.getElementById("login-container").style.display = "none";
            document.getElementById("profile-pic").style.display = "block";
            document.getElementById("profile-pic").src = user.photoURL;
            document.getElementById("display-name").innerText = user.displayName;
            document.getElementById("display-email").innerText = user.email;
        }
    });
</script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBn0kORKJHN_X4uVidhjulK-dAnRujOO3A",
            authDomain: "gaule-top-up-center.firebaseapp.com",
            databaseURL: "https://gaule-top-up-center-default-rtdb.firebaseio.com",
            projectId: "gaule-top-up-center",
            storageBucket: "gaule-top-up-center.firebasestorage.app",
            messagingSenderId: "645605489690",
            appId: "1:645605489690:web:0b0f2898d295be03c1e5a3"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        let isAdmin = false;
        let globalOrders = {};
        let currentStatusFilter = 'all';

        auth.onAuthStateChanged((user) => {

            if (user && isAdmin) {

            } else {

            }

        });

        db.ref('orders').on('value', (snapshot) => {
            globalOrders = snapshot.val() || {};
            renderOrders();
        }, (error) => {
            console.error(error);
            document.getElementById('orders-list').innerHTML = '<div class="no-data">Failed to load database orders!</div>';
        });

        function formatOrderDate(order) {
            let timestamp = order.timestamp || order.date || order.createdAt;
            if (!timestamp) return '';
            let dateObj = new Date(timestamp);
            if (isNaN(dateObj.getTime())) return '';
            
            return dateObj.toLocaleDateString('en-US', { 
                month: 'short', 
                day: 'numeric', 
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function renderOrders() {
            const container = document.getElementById('orders-list');
            container.innerHTML = '';
            
            const currentUser = auth.currentUser;
            
            if (!currentUser) {
                container.innerHTML = `
                    <div class="no-data">

                                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
                                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
                            </svg>
                            Continue with Google
                        </button>
                    </div>
                `;
                return;
            }

            const keys = Object.keys(globalOrders);
            if (keys.length === 0) {
                container.innerHTML = '<div class="no-data"><i class="fa-regular fa-folder-open" style="font-size: 24px; margin-bottom: 8px; display: block;"></i>No orders found in database!</div>';
                return;
            }

            const searchQuery = document.getElementById('orderSearchInput') ? document.getElementById('orderSearchInput').value.toLowerCase().trim() : '';
            let visibleCount = 0;

            keys.reverse().forEach(key => {
                const order = globalOrders[key];
                
                const orderEmail = (order.email || order.authEmail || '').toLowerCase();
                const currentEmail = (currentUser.email || '').toLowerCase();
                const orderUserId = order.userId || '';
                const currentUserId = currentUser.uid || '';

                const isOwner = (orderEmail && currentEmail && orderEmail === currentEmail) || 
                                (orderUserId && currentUserId && orderUserId === currentUserId);
                
                if (!isAdmin && !isOwner) return;

                const displayUID = (order.uid && order.uid.length < 20) ? order.uid : (order.playerId || order.gameId || order.playerUID || '');
                const displayPlayerName = order.playerName || '';
                const displayZoneId = order.zoneid || order.zoneId || order.zone || order.server || order.zoneID || '';
                const displayEmail = order.email || order.userEmail || order.authEmail || '';
                const productTitle = order.product || order.productName || order.title || 'Game Topup';
                let orderStatus = (order.status || 'pending').toLowerCase();
                
                if (orderStatus === 'cancelled') orderStatus = 'rejected';

                const orderAmount = order.amountDue !== undefined ? order.amountDue : (order.amount !== undefined ? order.amount : (order.price !== undefined ? order.price : (order.total || '0')));
                const orderIdStr = '#' + key.slice(-5);
                const orderDateStr = formatOrderDate(order);
                const transactionId = order.transactionId || order.txnId || order.transactionID || '';

                const matchesStatus = (currentStatusFilter === 'all' || orderStatus === currentStatusFilter || (currentStatusFilter === 'complete' && (orderStatus === 'completed' || orderStatus === 'complete')));
                const searchString = `${orderIdStr} ${productTitle} ${displayEmail} ${displayUID} ${displayPlayerName} ${displayZoneId} ${orderAmount} ${order.redeemCode || ''} ${transactionId} ${orderDateStr}`.toLowerCase();
                const matchesSearch = searchString.includes(searchQuery);

                if (matchesStatus && matchesSearch) {
                    visibleCount++;

                    let statusClass = 'status-pending';
                    if (orderStatus === 'completed' || orderStatus === 'complete') statusClass = 'status-completed';
                    else if (orderStatus === 'rejected') statusClass = 'status-rejected';

                    const cardHTML = `
                        <div class="order-card">
                            <div class="order-header">
                                <span class="order-id">${orderIdStr}</span>
                                <span class="order-status ${statusClass}">${orderStatus}</span>
                            </div>
                            <div class="item-details">
                                <div class="product-name"><i class="fa-solid fa-gem"></i> ${productTitle}</div>
                                ${orderDateStr ? `<div class="info-row"><i class="fa-solid fa-calendar-days"></i> ${orderDateStr}</div>` : ''}
                                ${displayEmail ? `<div class="info-row"><i class="fa-solid fa-envelope"></i> ${displayEmail}</div>` : ''}
                                ${displayUID ? `<div class="info-row"><i class="fa-solid fa-gamepad"></i> UID: <b>${displayUID}</b></div>` : ''}
                                ${displayPlayerName && displayPlayerName !== "Unknown" ? `<div class="info-row"><i class="fa-solid fa-user-check"></i> Player: <b style="color: #0284c7;">${displayPlayerName}</b></div>` : ''}
                                ${displayZoneId ? `<div class="info-row"><i class="fa-solid fa-server"></i> Zone ID: <b>${displayZoneId}</b></div>` : ''}
                                ${order.redeemCode ? `<div class="info-row" style="color:#2563eb;"><i class="fa-solid fa-key"></i> Code: <b>${order.redeemCode}</b></div>` : ''}
                                
                                <div class="admin-action-box ${isAdmin ? 'visible' : ''}" style="margin-top: 6px; margin-bottom: 0px; border-top: none; padding-top: 0px;">
                                    ${transactionId ? `<div class="info-row" style="color:#059669;"><i class="fa-solid fa-receipt"></i> Txn ID: <b>${transactionId}</b></div>` : `<div class="info-row" style="color:#6b7280;"><i class="fa-solid fa-receipt"></i> Txn ID: <b>Not Provided</b></div>`}
                                </div>

                                <div class="price-tag">Rs. ${orderAmount}</div>
                            </div>
                            <div class="admin-action-box ${isAdmin ? 'visible' : ''}">
                                <div class="admin-btn-row">
                                    <button class="adm-btn btn-complete" onclick="completeOrder('${key}')"><i class="fa-solid fa-check"></i> Complete</button>
                                    <button class="adm-btn btn-reject" onclick="updateStatus('${key}', 'rejected')"><i class="fa-solid fa-xmark"></i> Reject</button>
                                </div>
                                <div class="admin-btn-row">
                                    <a href="https://shop.garena.my" target="_blank" class="adm-btn btn-topup"><i class="fa-solid fa-external-link-alt"></i> Top Up</a>
                                </div>
                                <button class="adm-btn btn-delete" onclick="deleteOrder('${key}')"><i class="fa-solid fa-trash"></i> Delete Order</button>
                            </div>
                        </div>
                    `;
                    container.insertAdjacentHTML('beforeend', cardHTML);
                }
            });

            if (visibleCount === 0) {
                container.innerHTML = '<div class="no-data">No orders found for this account!</div>';
            }
        }

        function toggleSearchbar() {
            const searchBar = document.getElementById('searchBarContainer');
            const filterTabs = document.getElementById('filterTabs');
            const searchIcon = document.getElementById('searchIconToggle');
            const input = document.getElementById('orderSearchInput');

            searchBar.classList.toggle('active');
            filterTabs.classList.toggle('shifted');

            if (searchBar.classList.contains('active')) {
                searchIcon.className = "fa-solid fa-xmark";
                input.focus();
            } else {
                searchIcon.className = "fa-solid fa-magnifying-glass";
                input.value = '';
                renderOrders();
            }
        }

        function filterOrders(status, button) {
            currentStatusFilter = status;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            button.classList.add('active');
            renderOrders();
        }

        function completeOrder(key) {
            const redeemCode = prompt("Enter the Unipin / Redeem Code (Optional - click OK/Cancel to leave empty):");
            let updateData = { status: 'complete' };
            
            if (redeemCode !== null && redeemCode.trim() !== "") {
                updateData.redeemCode = redeemCode.trim();
            }

            db.ref('orders/' + key).update(updateData).catch(err => alert(err.message));
        }

        function updateStatus(key, status) {
            db.ref('orders/' + key).update({ status: status }).catch(err => alert(err.message));
        }

        function deleteOrder(key) {
            if (confirm("Yo order database bata permanent delete garne ho?")) {
                db.ref('orders/' + key).remove().catch(err => alert(err.message));
            }
        }

        function handleAuthAction() {
            if (!auth.currentUser) {
                auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(err => alert(err.message));
            }
        }
    </script>
</body>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const currentPath = window.location.pathname;
        const navItems = document.querySelectorAll('.bottom-nav .nav-item');

        navItems.forEach(item => {
            const href = item.getAttribute('href');
            const cleanHref = href.replace(/\.\./g, '').replace(/\/+/g, '/');
            
            if (cleanHref !== "/" && currentPath.includes(cleanHref)) {
                navItems.forEach(nav => nav.classList.remove('active'));
                item.classList.add('active');
            } else if (cleanHref === "/" && (currentPath === "/" || currentPath.endsWith("index.html"))) {
                navItems.forEach(nav => nav.classList.remove('active'));
                item.classList.add('active');
            }
        });
    });
</script>
